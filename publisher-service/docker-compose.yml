version: "3.8"

services:
  spark-master:
    image: apache/spark:4.0.2
    container_name: spark-master
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.master.Master",
        "--host",
        "spark-master",
        "--port",
        "7077",
        "--webui-port",
        "8080"
      ]
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./publisher-spark/target:/app
      - ./data:/data

  spark-worker:
    image: apache/spark:4.0.2
    container_name: spark-worker
    depends_on:
      - spark-master
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
        "--webui-port",
        "8081"
      ]
    ports:
      - "8081:8081"
    volumes:
      - ./publisher-spark/target:/app
      - ./data:/data