# Kafka broker address
bootstrap.servers=viaduct.proxy.rlwy.net:18942
# Kafka Streams application ID — must be unique per deployment
application.id=candle-processor

# Input topic containing raw stock ticks (key = symbol)
input.topic=stock-ticks

# Number of stream processing threads
num.stream.threads=4

# Start from the beginning if no committed offset exists
auto.offset.reset=earliest

# Flush/commit after every 100ms instead of the default 30s — eliminates batching lag
commit.interval.ms=100

# Local directory for RocksDB state stores
state.dir=/tmp/kafka-streams/candle-processor
