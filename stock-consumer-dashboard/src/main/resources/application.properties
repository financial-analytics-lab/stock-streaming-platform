# Railway sets PORT at runtime; 8085 is the local default
server.port=${PORT:8085}
spring.application.name=stock-dashboard
spring.jackson.serialization.write-dates-as-timestamps=false

# Storage settings — override via STORAGE_BASE_DIR env var
storage.base-dir=${STORAGE_BASE_DIR:/data}
storage.flush-cron=${STORAGE_FLUSH_CRON:0 * * * * *}
storage.flush-window-minutes=${STORAGE_FLUSH_WINDOW_MINUTES:1}

# CORS — comma-separated list of allowed origins for /api/**
# Set ALLOWED_ORIGINS to your Railway UI URL in production
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# News data — single all_news_by_date.json baked into /app/news/ at image build time
# Override via NEWS_DATA_FILE env var if you mount a volume instead
news.data.file=${NEWS_DATA_FILE:/app/news/all_news_by_date.json}
