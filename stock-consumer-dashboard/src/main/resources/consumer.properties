# Stock Consumer Core - Example Configuration
# Copy to consumer.properties on your classpath, or set STOCK_CONSUMER_* env vars.
#
# Env vars take precedence over this file.

# ---- Broker / poll settings (shared by all consumers in the JVM) ----
bootstrap.servers=viaduct.proxy.rlwy.net:18942

poll.timeout.ms=1000
auto.offset.reset=earliest
max.poll.records=500

# ---- Tick consumer subscription ----
# Env vars: STOCK_CONSUMER_TICK_TOPIC, STOCK_CONSUMER_TICK_GROUP_ID
tick.topic=stock-ticks
tick.group.id=dashboard-tick-consumer

# ---- News consumer subscription ----
# Env vars: STOCK_CONSUMER_NEWS_TOPIC, STOCK_CONSUMER_NEWS_GROUP_ID
news.topic=news-events
news.group.id=dashboard-news-consumer